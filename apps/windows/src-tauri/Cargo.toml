[package]
name = "localdrop_server"
version = "1.0.0"
description = "LocalDrop Windows companion: receives and verifies iPhone photo/video backups over the local network"
authors = ["LocalDrop"]
edition = "2021"
rust-version = "1.77"
default-run = "localdrop_server"

[lib]
name = "localdrop_server_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }
axum = { version = "0.7", features = ["ws", "http1", "json", "tokio", "query"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
futures = "0.3"
dirs = "5"
mime = "0.3"
# Advertises `_localdrop._tcp` over mDNS so the iPhone can find this PC without the user typing
# an IP address. The only networking dependency in the server; everything else is std + axum.
mdns-sd = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
